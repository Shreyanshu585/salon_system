  gatewayserver:
    image: "shreyanshu05/salon-gatewayserver:v1"
    ports:
      - "6007:8090"
    healthcheck:
      test: "curl --fail --silent gatewayserver:8090/actuator/health/readiness | grep up || exit 1"
      interval: 10s

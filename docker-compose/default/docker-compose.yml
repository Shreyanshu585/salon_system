    networks:
      - shreyanshu05

  service-offering:
    image: "shreyanshu05/salon-service-offering:v1"
    ports:
      - "6006:8066"
    healthcheck:
      test: "curl --fail --silent service-offering:8066/actuator/health/readiness | grep up || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    container_name: service-offering
    depends_on:
      service-offeringdb:
